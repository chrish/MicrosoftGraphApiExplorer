name: Refresh Graph API Metadata

on:
  schedule:
    # Every Monday at 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Fetch metadata and rebuild outputs
        run: npm run refresh

      - name: Commit updated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/ docs/targets-beta.md docs/targets-v1.md
          git diff --staged --quiet && echo "No changes to commit." || (
            git commit -m "chore: refresh Graph API metadata $(date -u '+%Y-%m-%d')"
            git push
          )
